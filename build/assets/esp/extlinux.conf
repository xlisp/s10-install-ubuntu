default rescue
menu title S10 rescue
timeout 0

label rescue
	menu label Rescue installer
	linux /vmlinuz
	initrd /initramfs-rescue.gz
	dtb /exynos9820-beyond1lte.dtb
	append console=tty0 loglevel=8 panic=30

label ubuntu
	menu label Ubuntu 26.04
	linux /vmlinuz
	dtb /exynos9820-beyond1lte.dtb
	append root=PARTLABEL=ubuntu-root rootwait rw console=tty0 console=ttyGS0,115200n8 loglevel=4
